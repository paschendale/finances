# =============================================================================
#  Finances — local Docker stack
#  PostgreSQL · PostgREST · static UI (nginx + migrations on startup)
# =============================================================================
#
#  Quick start
#  -----------
#    docker compose up --build
#
#    UI  → http://localhost:8080
#    API → http://localhost:3000
#    Login with the plaintext token (default): local-dev-login
#
#  Optional: copy compose.env.example → .env to override ports or secrets.
#  Changing COMPOSE_VITE_APP_API_URL or APP_ORIGIN requires rebuilding the app.
#
#  Note: your repo `.env` may define VITE_APP_API_URL for `npm run dev`. Docker
#  ignores that for the image build and uses COMPOSE_VITE_APP_API_URL instead
#  (default http://localhost:3000) so local PostgREST is always targeted.
#
# -----------------------------------------------------------------------------
#  Environment variables (all optional; defaults are for local use only)
# -----------------------------------------------------------------------------
#
#  POSTGRES_PASSWORD              Postgres superuser password
#  JWT_SECRET                     Same value for DB (set_jwt_secret) + PostgREST
#  FINANCES_BOOTSTRAP_TOKEN       Plaintext token registered on each app start
#  APP_HTTP_PORT                  Published port for the UI
#  POSTGREST_PORT                 Published port for the API
#  COMPOSE_VITE_APP_API_URL       Baked into the Docker UI build (browser → API)
#  APP_ORIGIN                     PostgREST CORS allowlist (comma-separated)
#
#  Advisor (AI assistant, see docs/ADVISOR.md and advisor/README.md)
#  ADVISOR_PORT                   Published port for the advisor HTTP API (3100)
#  ADVISOR_CHANNELS               web | web,discord | web,discord,gmail
#  COMPOSE_VITE_APP_ADVISOR_URL   Baked into the UI build (browser → advisor), default http://localhost:3100
#  DISCORD_BOT_TOKEN, DISCORD_GUILD_ID, DISCORD_CHANNEL_ID, DISCORD_OBEYED_USER_IDS   when discord is enabled
#  GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN                          when gmail is enabled
#  TZ                             Time zone for the advisor (dates in prompts and nudges)
#
#  First run of the advisor: `docker compose exec -it advisor claude login`, then check
#  http://localhost:3100/health.
#
# =============================================================================

name: finances

services:
  db:
    image: postgis/postgis:17-master
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: finances
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finances"]
      interval: 3s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_API_URL: ${COMPOSE_VITE_APP_API_URL:-http://localhost:3000}
        VITE_APP_ADVISOR_URL: ${COMPOSE_VITE_APP_ADVISOR_URL:-http://localhost:3100}
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/finances
      JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-not-for-production}
      FINANCES_BOOTSTRAP_TOKEN: ${FINANCES_BOOTSTRAP_TOKEN:-local-dev-login}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 180s

  postgrest:
    image: postgrest/postgrest:v12.2.12
    ports:
      - "${POSTGREST_PORT:-3000}:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/finances
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-not-for-production}
      PGRST_SERVER_PORT: "3000"
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: ${APP_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  advisor:
    build:
      context: .
      dockerfile: advisor/Dockerfile
    environment:
      TZ: ${TZ:-UTC}
      ADVISOR_ENV: dev
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/finances
      PROD_DATABASE_NAME: __none__
      POSTGREST_URL: http://postgrest:3000
      FINANCES_TOKEN: ${FINANCES_BOOTSTRAP_TOKEN:-local-dev-login}
      JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-not-for-production}
      PUBLIC_WEB_ORIGINS: ${APP_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
      ADVISOR_CHANNELS: ${ADVISOR_CHANNELS:-web}
      WEB_APP_URL: ${WEB_APP_URL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_OBEYED_USER_IDS: ${DISCORD_OBEYED_USER_IDS:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
    ports:
      - "${ADVISOR_PORT:-3100}:3100"
    volumes:
      - advisor_claude:/home/advisor/.claude   # Claude Code login + sessions
      - advisor_data:/data                     # statements, workspaces
    depends_on:
      postgrest:
        condition: service_started

volumes:
  postgres_data:
  advisor_claude:
  advisor_data:
